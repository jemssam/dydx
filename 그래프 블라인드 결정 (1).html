function seeded(items,seed){let s=0;for(const c of seed)s=(Math.imul(s^c.charCodeAt(0),16777619))>>>0;s=s||1;const v=items.slice();for(let i=v.length-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)>>>0;const j=s%(i+1);[v[i],v[j]]=[v[j],v[i]];}return v;}

function mono(P){const n=P.length,X=P.map(p=>p[0]),Y=P.map(p=>p[1]),d=[],m=[];for(let i=0;i<n-1;i++)d[i]=(Y[i+1]-Y[i])/(X[i+1]-X[i]);
  m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=0;m[i+1]=0;continue;}const a=m[i]/d[i],b=m[i+1]/d[i],q=a*a+b*b;if(q>9){const t=3/Math.sqrt(q);m[i]=t*a*d[i];m[i+1]=t*b*d[i];}}
  return x=>{let i=0;while(i<n-2&&x>X[i+1])i++;const h=X[i+1]-X[i],t=Math.min(1,Math.max(0,(x-X[i])/h)),t2=t*t,t3=t2*t;return (2*t3-3*t2+1)*Y[i]+(t3-2*t2+t)*h*m[i]+(-2*t3+3*t2)*Y[i+1]+(t3-t2)*h*m[i+1];};}

/* ---------- 후보 그래프가 단서와 맞는지 (교사 화면 '단서 비교'와 채점 설명에 사용) ---------- */
function feat(r,f){const [a,b]=r.dom,df=x=>(f(x+1e-3)-f(x-1e-3))/2e-3;

  const ext=crit.map(x=>({x,v:f(x),type:df(x-0.05)>0?'max':'min'}));
  const pts=[a,...crit,b],ivs=pts.slice(0,-1).map((p,i)=>({l:p,r:pts[i+1],up:df((p+pts[i+1])/2)>0}));
  let rmax=a,rmin=a;for(let x=a;x<=b;x+=0.01){if(df(x)>df(rmax))rmax=x;if(df(x)<df(rmin))rmin=x;}
  return {crit,ext,ivs,rmax,rmin,decr:df(rmin)<0,fa:f(a),fb:f(b),f12:f(12),end:Math.sign(df(b-0.05)),rc:r.c!=null?roots(x=>f(x)-r.c,a,b):[]};}
function fits(id,T,C){const near=(p,q,t)=>Math.abs(p-q)<=t,rel=(p,q)=>Math.abs(p-q)<=Math.max(8,Math.abs(q)*0.04);
  const iv=(A,B)=>(!A&&!B)||(A&&B&&near(A.l,B.l,0.5)&&near(A.r,B.r,0.5));
  const ex=(t)=>{const P=T.ext.filter(e=>e.type===t),Q=C.ext.filter(e=>e.type===t);return P.length===Q.length&&P.every((e,i)=>near(e.x,Q[i].x,0.5)&&rel(Q[i].v,e.v));};
  switch(id){
   case 1:return T.ext.filter(e=>e.type==='max').length===C.ext.filter(e=>e.type==='max').length&&T.ext.filter(e=>e.type==='min').length===C.ext.filter(e=>e.type==='min').length;
   case 2:return iv(T.ivs.find(v=>v.up),C.ivs.find(v=>v.up));
   case 3:return iv(T.ivs.find(v=>!v.up),C.ivs.find(v=>!v.up));
   case 4:return T.crit.length===C.crit.length&&T.crit.every((x,i)=>near(x,C.crit[i],0.5));
   case 5:return ex('max');case 6:return ex('min');
   case 7:return near(T.rmax,C.rmax,0.75);
   case 8:return T.decr===C.decr&&(!T.decr||near(T.rmin,C.rmin,0.75));
   case 9:return rel(C.fa,T.fa);case 10:return rel(C.fb,T.fb);case 11:return T.end===C.end;case 12:return rel(C.f12,T.f12);
   case 13:return T.rc.length===C.rc.length&&T.rc.every((x,i)=>near(x,C.rc[i],0.3));}
  return true;}
function remaining(r,ids){const C=candidates(r),T=feat(r,C.find(c=>c.ans).fn);return C.filter(c=>c.ans||ids.every(id=>fits(id,T,feat(r,c.fn))));}

function vSolver(R){const r=R.req,d=DATA[r.data];

function vGraph(R){const r=R.req,cat=catalogue(r),C=candidates(r),yb=bounds(r,C.map(c=>c.fn)),left=C.filter(c=>!R.out.includes(c.id)).length;

  </div><div style="margin-top:14px">

  if(t==='demo')body=`<h2>교사 시범 (7분)</h2><div class="box"><b>안성맞춤랜드 · 가장 붐비는 때</b><p class="small" style="margin:4px 0 0">선생님이 분석 모둠, 학생 대표 2명이 복원 모둠을 맡아요. 학생 화면과 똑같이 진행돼요.</p></div>
   <div class="sec"><h3>꼭 보여 줄 다섯 가지</h3><ol class="small" style="margin:0;padding-left:18px;display:grid;gap:6px">
    <li><b>ChatGPT로 식 만들기</b> · 문장 복사 → 계수 넣고 확인</li>
    <li><b>직접 미분</b> · f′(x) = −3x² + 60x − 192 = −3(x − 4)(x − 16) → <b>4시는 정의역(7~19시) 밖이니 지워요</b> → 증감표 7시 406 ↗ 16시 1135 ↘ 19시 946</li>
    <li><b>카드 고르는 생각을 소리 내어</b> · "최댓값을 바로 알려 주는 카드는 없어요. 미분으로 아는 정보만 줄 수 있어요. 많이 주면 쉽지만 점수가 낮고, 적게 주면 틀릴 수 있어요. 증가 구간 한 장이면 16시까지 오르다 내려가니 충분하겠다."</li>
    <li><b>후보 지우기</b> · 학생 대표가 카드와 맞지 않는 그래프를 지우고, 남은 하나를 고르기</li>
    <li><b>이유 쓰는 법</b> · ❌ "16" → ⭕ "16시까지 늘다가 줄어들므로 16시(1135명)가 가장 많다."</li></ol>
    <div class="box yel"><b>마지막 질문 (답은 말하지 않기)</b> "이번엔 극대가 가장 높은 곳이었어요. 항상 그럴까요?"</div>
    <button class="btn navy big" id="runDemo">시범 시작 (학생 화면으로 진행)</button></div>`;
  if(t==='clock'){const c=S.clock;body=`<h2>타이머</h2><div class="bigclock ${c.left<=60&&c.run?'urgent':''}" id="bc">${mmss(c.left)}</div>
   <div class="row" style="justify-content:center">${[[420,'분석 7분'],[300,'복원 5분'],[180,'3분'],[60,'1분']].map(([v,l])=>`<button class="btn" data-ck="${v}">${l}</button>`).join('')}</div>
   <div class="row" style="justify-content:center;margin-top:10px"><button class="btn navy" id="ckGo">${c.run?'일시정지':'시작'}</button><button class="btn" id="ckReset">다시</button></div>`;}
  if(t==='board'){const mx=Math.max(...S.board);body=`<h2>점수판</h2><p class="small muted" style="margin:0 0 10px">라운드가 끝날 때마다 각 모둠이 결과 화면의 점수를 말하면 더해 주세요. 노란 칸이 현재 1등이에요.</p>
   <div class="board">${S.board.map((v,i)=>`<div class="bcell ${mx>0&&v===mx?'top':''}"><b>${i+1}모둠</b><div class="sc">${v}</div><div class="row">${[10,15,20].map(n=>`<button class="btn sm" data-b="${i}" data-d="${n}">+${n}</button>`).join('')}</div><div class="row"><button class="btn sm" data-b="${i}" data-d="5">+5</button><button class="btn sm" data-b="${i}" data-d="-5">−5</button></div></div>`).join('')}</div>
   <button class="btn sm" id="bReset" style="margin-top:12px">점수판 초기화</button>`;}
  if(t==='cmp'){const r=REQ.find(q=>q.id===S.cmp.case),cat=catalogue(r),C=candidates(r),yb=bounds(r,C.map(c=>c.fn)),rem=remaining(r,S.cmp.ids).map(c=>c.id);
   body=`<h2>단서 비교 · 공유 시간</h2><p class="small muted" style="margin:0 0 10px">모둠이 보낸 카드를 눌러 보세요. 그 카드만으로 남는 후보 그래프가 보여요. 결과가 갈린 두 모둠의 카드를 차례로 눌러 비교해요.</p>
   <div class="tabs">${REQ.map(q=>`<button class="tab" data-cc="${q.id}" aria-selected="${q.id===S.cmp.case}">${q.id==='demo'?'시범':esc(q.what)}</button>`).join('')}</div>
   <div class="box" style="margin-top:12px"><b>${esc(r.who)}의 의뢰</b> · <span class="small">${esc(r.text)}</span></div>
   <div class="sec hints">${cat.map(h=>`<button class="pickc" data-ci="${h.id}" aria-pressed="${S.cmp.ids.includes(h.id)}"><b>${String(h.id).padStart(2,'0')}</b><span><strong>${esc(h.short)}</strong><small>${S.cmp.ids.includes(h.id)?esc(h.answer):esc(h.prompt)}</small></span></button>`).join('')}</div>
   <div class="box yel row" style="margin-top:12px"><b>남은 후보 ${rem.length}개</b> <span class="small">${rem.length===1?'· 이 카드들로 진짜 그래프를 찾을 수 있어요.':'· 아직 헷갈리는 그래프가 있어요. 무엇이 다른가요?'}</span> <button class="btn sm" id="cmpShow">${S.cmp.show?'정답 숨기기':'정답 보기'}</button> <button class="btn sm" id="cmpClr">카드 초기화</button></div>
   <div class="cands" style="margin-top:12px">${C.map(c=>`<div class="cand ${rem.includes(c.id)?'':'out'}" aria-checked="${S.cmp.show&&c.ans}"><b>${c.label}</b>${svgGraph(r,{curves:[{fn:c.fn,col:S.cmp.show&&c.ans?'var(--good)':'var(--an)'}],yb,w:380,h:230,aria:c.label+'번 그래프',cline:r.c!=null})}</div>`).join('')}</div>`;}
  if(t==='key')body=`<h2>정답과 결정적인 단서</h2><div class="tscroll"><table><tr><th>사건</th><th>함수</th><th>f′(x)=0</th><th>정답</th><th>결정적인 단서</th></tr>
   ${REQ.map(r=>`<tr><td style="text-align:left"><b>${esc(r.groups)}</b><br>${esc(r.who)} · ${esc(r.what)}<br><span class="small muted">${r.dom[0]}~${r.dom[1]}시</span></td><td>${esc(fmtPoly(xco(DATA[r.data])))}</td><td>${rtList(DATA[r.data]).map(tl).join(', ')}</td><td><b>${keyText(r)}</b></td><td class="small" style="text-align:left">${esc(r.key)}</td></tr>`).join('')}</table></div>
   <h3 style="margin-top:14px">순회 발문</h3><div class="rule">
    <div><b>분석할 때</b><span class="small">"AI가 준 식에 9를 넣으면 데이터 값과 같아요?" · "f′(x)=0의 해 중 정의역 밖은?" · "의뢰가 묻는 건 그래프의 어느 부분이에요?"</span></div>
    <div><b>카드 고를 때</b><span class="small">"이 카드만 받으면 어떤 그래프와 헷갈릴까요?" · "한 장 줄이면 어떻게 될까요?"</span></div>
    <div><b>복원할 때</b><span class="small">"이 카드로 어떤 후보를 지울 수 있어요?" · "남은 두 그래프는 어디가 달라요?" · "이유에 시각·단위·그래프 모양이 들어갔어요?"</span></div></div>
   <h3 style="margin-top:14px">정리 (44–50분)</h3><div class="box yel"><b>① 극값만으로는 최댓값·최솟값을 알 수 없다. 정의역의 끝값까지 비교한다.</b><br>② 의뢰가 정의역을 정한다. f′(x)=0의 해가 정의역 밖이면 지운다.<br>③ 가장 빠르게 변하는 때는 극값이 아니라 f′(x)가 가장 큰 때다.<br>④ AI는 데이터를 식으로 바꿔 주지만, 무엇이 필요한지 고르고 그래프로 결정하는 건 우리의 몫이다.</div>
   <h3 style="margin-top:14px">출구 카드</h3><div class="box">"최댓값을 알려 주려면 극값 말고 어떤 정보가 더 필요한가? 그 이유를 그래프로 설명하시오."</div>`;
  return `<section class="panel"><div class="tabs" role="tablist">${TT.map(([k,l])=>`<button class="tab" role="tab" data-tt="${k}" aria-selected="${t===k}">${l}</button>`).join('')}</div></section><section class="panel" style="margin-top:12px">${body}</section>`;}

/* ---------- 렌더 ---------- */
let ck=null;
function render(){const app=$('app');$('vStudent').className='btn'+(S.view==='student'?' navy':'');$('vTeacher').className='btn'+(S.view==='teacher'?' navy':' yel');
  if(S.view==='teacher'){app.innerHTML=vTeacher();bindTeacher();return;}
  const R=S.round;if(!R){app.innerHTML=vSetup();bindSetup();return;}
  const bar=R.demo?`<div class="demo-bar"><span>교사 시범 중 · 안성맞춤랜드</span><button class="btn sm" id="endDemo">교사 화면으로</button></div>`:'';
  app.innerHTML=`<div style="display:grid;gap:12px">${bar}${({solver:vSolver,pick:vPick,hand:vHand,graph:vGraph,result:vResult})[R.stage](R)}</div>`;bindRound();}
const keepY=fn=>{const y=window.scrollY;fn();render();window.scrollTo(0,y);};
function copy(t,m){try{navigator.clipboard.writeText(t).then(()=>{$(m).textContent='복사했어요';},()=>{$(m).textContent='길게 눌러 직접 복사하세요';});}catch(e){$(m).textContent='길게 눌러 직접 복사하세요';}}
function bindSetup(){$('gSel').onchange=e=>{S.g=+e.target.value;save();render();};document.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>{S.roundNo=+b.dataset.rn;save();render();});
  $('start').onclick=()=>{S.round=newRound(caseFor(S.g,S.roundNo),S.g,partnerOf(S.g),false);render();window.scrollTo(0,0);};}
function bindRound(){const R=S.round,on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn);},go=st=>{R.stage=st;render();window.scrollTo(0,0);};
  on('endDemo','click',()=>{S.round=null;S.view='teacher';render();});
  on('cp','click',()=>copy($('pr').textContent,'cpm'));
  [0,1,2,3].forEach(i=>on('co'+i,'input',e=>{R.co[i]=e.target.value;}));
  on('coChk','click',()=>keepY(()=>{R.coTry++;const co=R.co.map(v=>parseFloat(String(v).replace('−','-'))),X=xco(DATA[R.req.data]);R.coOk=co.every((v,i)=>isFinite(v)&&Math.abs(v-X[i])<=Math.max(0.05,Math.abs(X[i])*0.002));}));
  [0,1].forEach(i=>on('r'+i,'input',e=>{R.rt[i]=e.target.value;}));
  on('rtChk','click',()=>keepY(()=>{R.rtTry++;const want=rtList(DATA[R.req.data]),got=R.rt.map(v=>parseFloat(String(v).replace('−','-'))).filter(isFinite).sort((p,q)=>p-q);R.rtOk=got.length===2&&got.every((v,i)=>Math.abs(v-want[i])<0.01);}));
  on('toPick','click',()=>go('pick'));
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>keepY(()=>{const id=+b.dataset.s;if(R.sent.includes(id))R.sent=R.sent.filter(v=>v!==id);else if(R.sent.length<3)R.sent.push(id);}));
  on('toHand','click',()=>go('hand'));on('toGraph','click',()=>go('graph'));
  on('openExtra','click',()=>keepY(()=>{R.openExtra=true;}));on('closeExtra','click',()=>keepY(()=>{R.openExtra=false;}));
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>keepY(()=>{R.extra=+b.dataset.x;R.openExtra=false;}));
  document.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>keepY(()=>{const id=b.dataset.out;R.out=R.out.includes(id)?R.out.filter(v=>v!==id):[...R.out,id];if(R.out.includes(R.cand))R.cand=null;}));
  document.querySelectorAll('[data-cand]').forEach(b=>b.onclick=()=>keepY(()=>{R.cand=b.dataset.cand;}));
  const ready=()=>{const s=$('submit');if(s)s.disabled=!(R.cand&&R.ans.a.trim()&&(R.req.kind!=='iv'||R.ans.b.trim())&&R.why.trim());};
  on('aA','input',e=>{R.ans.a=e.target.value;ready();});on('aB','input',e=>{R.ans.b=e.target.value;ready();});on('why','input',e=>{R.why=e.target.value;ready();});
  on('submit','click',()=>{const graphOk=candidates(R.req).find(c=>c.id===R.cand)?.ans===true,aOk=ansOk(R.req,R.ans);
    const gs=(graphOk?10:0)+(aOk?10:0)-(R.extra?5:0),exact=remaining(R.req,R.sent).length===1,as=exact?SENT_PTS[R.sent.length]:0;R.result={graphOk,ansOk:aOk,gs,as,exact};
    if(!R.demo){S.hist.unshift({n:S.roundNo,me:AN(R),p:GR(R),who:R.req.who,sent:R.sent.length,ok:graphOk,gs,as});save();}go('result');});
  on('cpSum','click',()=>copy($('sum').textContent,'cpSumM'));
  on('done','click',()=>{if(R.demo){S.round=null;S.view='teacher';}else{S.round=null;if(S.roundNo===1){S.roundNo=2;save();}}render();window.scrollTo(0,0);});}
function bindTeacher(){document.querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>{S.tTab=b.dataset.tt;render();});
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};
  on('runDemo',()=>{S.round=newRound(REQ[0],0,0,true);S.view='student';render();window.scrollTo(0,0);});
  document.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{S.clock={total:+b.dataset.ck,left:+b.dataset.ck,run:false};stopCk();render();});
  on('ckGo',()=>{const c=S.clock;if(c.run){c.run=false;stopCk();}else{c.run=true;c.end=Date.now()+c.left*1000;ck=setInterval(()=>{c.left=Math.max(0,Math.round((c.end-Date.now())/1000));const el=$('bc');if(el){el.textContent=mmss(c.left);el.classList.toggle('urgent',c.left<=60);}if(c.left<=0){c.run=false;stopCk();if(S.tTab==='clock')render();}},250);}render();});
  on('ckReset',()=>{stopCk();S.clock={total:S.clock.total,left:S.clock.total,run:false};render();});
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const i=+b.dataset.b;S.board[i]=Math.max(0,S.board[i]+(+b.dataset.d));save();render();});
  on('bReset',()=>{S.board=Array(8).fill(0);save();render();});
  document.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{S.cmp={case:b.dataset.cc,ids:[],show:false};render();});
  document.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>keepY(()=>{const id=+b.dataset.ci;S.cmp.ids=S.cmp.ids.includes(id)?S.cmp.ids.filter(v=>v!==id):[...S.cmp.ids,id];}));
  on('cmpShow',()=>keepY(()=>{S.cmp.show=!S.cmp.show;}));on('cmpClr',()=>keepY(()=>{S.cmp.ids=[];S.cmp.show=false;}));}
function stopCk(){if(ck)clearInterval(ck);ck=null;}
$('vStudent').onclick=()=>{S.view='student';render();};$('vTeacher').onclick=()=>{S.view='teacher';render();};
if(location.hash==='#teacher')S.view='teacher';
render();
</script>

</body></html>
